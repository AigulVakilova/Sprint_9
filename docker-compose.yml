version: "3.8"

services:

  selenoid:
    image: aerokube/selenoid:latest
    container_name: selenoid
    ports:
      - "4444:4444"
    networks:
      - selenoid
    volumes:
      - ./browsers.json:/etc/selenoid/browsers.json
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["-conf", "/etc/selenoid/browsers.json", "-container-network", "selenoid"]

  test_docker:
    build: .
    container_name: test_docker
    links:
      - selenoid
    environment:
      - SELENOID_URL=http://selenoid:4444/wd/hub
    depends_on:
      - selenoid
    networks:
      - selenoid
    volumes:
      - ./allure-results:/app/allure-results
    command: ["pytest", "tests", "--alluredir=allure-results", "-v"]

networks:
  selenoid:
    name: selenoid
    